[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "0.9.0"
description = "Derivatives pricing, volatility surfaces, quantitative risk and high-frequency alpha research, verified against closed forms and published benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/zihadpcode/QuantForge"

[project.optional-dependencies]
# matplotlib is needed only by examples/ and the notebook, never by the library
examples = ["matplotlib>=3.7"]
dev = ["quantforge[examples]", "pytest>=7", "scikit-learn>=1.3", "statsmodels>=0.14", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# report generators build long Markdown table rows inline
"examples/*" = ["E501"]
